<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" conteant="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form" method="post" action="https://www.freecodecamp.org/practice-project">
        <fieldset>
            <label for="name" id="name-label">Name <input type="text" id="name" placeholder="Enter your name" required></label>
            <label for="email" id="email-label">Email <input type="email" id="email" placeholder="Enter your email" required></label>
            <label for="number" id="number-label">Age <input type="number" id="number" placeholder="Enter your age" min="18" max="35" required></label>
        </fieldset>
        <fieldset>
            <legend>Which option best describes your current role?</legend>    
            <select id="dropdown">
                <option value="">Select current role</option>
                <option value="1">Student</option>
                <option value="2">Full Time Job</option>
                <option value="3">Full Time learner</option>
                <option value="4">Prefer not to say</option>
                <option value="5">Other</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Would you recommend freeCodeCamp to a friend?</legend>
                <label><input type="radio" name="check" value="1" class="inline">Definitely</label>
                <label><input type="radio" name="check" value="2" class="inline">Maybe</label>
                <label><input type="radio" name="check" value="3" class="inline">Not sure</label>
        </fieldset>
        <fieldset>
            <legend>What is your favorite feature of freeCodeCamp?</legend>    
            <select id="dropdown">
                <option value="0">Select an option</option>
                <option value="1">Challenges</option>
                <option value="2">Projects</option>
                <option value="3">Community</option>
                <option value="4">Open Source</option>
            </select>
        </fieldset>
        <fieldset>  
            <legend>What would you like to see improved? (Check all that apply)</legend>
            <label><input type="checkbox" value="1" class="inline">Front-end Projects</label>
            <label><input type="checkbox" value="2" class="inline">Back-end Projects</label>
            <label><input type="checkbox" value="3" class="inline">Data Visualization</label>
            <label><input type="checkbox" value="4" class="inline">Challenges</label>
            <label><input type="checkbox" value="5" class="inline">Open Source Community</label>
            <label><input type="checkbox" value="5" class="inline">Gitter help rooms</label>
            <label><input type="checkbox" value="5" class="inline">Videos</label>
            <label><input type="checkbox" value="5" class="inline">City Meetups</label>
            <label><input type="checkbox" value="5" class="inline">Wiki</label>
            <label><input type="checkbox" value="5" class="inline">Forum</label>
            <label><input type="checkbox" value="5" class="inline">Additional Courses</label>
        <label>Any comments or suggestions?
            <textarea type="textarea" rows="5" cols="30" placeholder="Enter your comment here..."></textarea>
        </label>
        </fieldset>
        <input type="submit" id="submit">
    </form>
</body>
</html>
